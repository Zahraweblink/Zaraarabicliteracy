<!-- Native Arabic Speech Engine Fix -->
    <script>
        function playWordAudio(textToSpeak) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Stop any overlapping sounds

                const utterance = new SpeechSynthesisUtterance(textToSpeak);
                utterance.rate = 0.8; // Nice, clear pace for Tajweed

                // Force the browser to find an Arabic voice so it never says "one" in English
                const voices = window.speechSynthesis.getVoices();
                const arabicVoice = voices.find(voice => voice.lang.startsWith('ar') || voice.lang.includes('ar-'));
                
                if (arabicVoice) {
                    utterance.voice = arabicVoice;
                }
                utterance.lang = 'ar-SA';

                window.speechSynthesis.speak(utterance);
            } else {
                alert("Text-to-speech is not supported on your browser.");
            }
        }

        // Preload voices so they are ready instantly when clicked
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
        }
    </script>
