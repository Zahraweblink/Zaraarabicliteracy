<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spelling Bee - Arabic Literacy</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-gold: #f59e0b;
            --accent-blue: #38bdf8;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --success: #22c55e;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-light);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            color: var(--accent-gold);
            font-size: 2.2rem;
            margin-bottom: 8px;
        }

        header p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .game-container {
            width: 100%;
            max-width: 700px;
            background-color: var(--card-bg);
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #334155;
        }

        .score-board, .level-board {
            background-color: #0f172a;
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: bold;
            color: var(--accent-gold);
        }

        .audio-section {
            text-align: center;
            margin: 20px 0;
        }

        .listen-btn {
            background-color: var(--accent-gold);
            color: #000;
            border: none;
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .listen-btn:hover {
            transform: scale(1.05);
            background-color: #eab308;
        }

        .meaning-hint {
            color: var(--accent-blue);
            font-size: 1.1rem;
            margin-top: 12px;
            font-style: italic;
        }

        /* Construction Area */
        .answer-display {
            min-height: 70px;
            background-color: #0f172a;
            border: 2px dashed #334155;
            border-radius: 8px;
            display: flex;
            flex-row-reverse: row; /* Right-to-left layout for Arabic */
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 10px;
            margin: 20px 0;
        }

        .tile {
            background-color: var(--accent-blue);
            color: #0f172a;
            font-size: 1.8rem;
            font-weight: bold;
            width: 50px;
            height: 50px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            transition: transform 0.1s, background-color 0.2s;
        }

        .tile:hover {
            transform: translateY(-2px);
        }

        .tile.answer-tile {
            background-color: var(--accent-gold);
        }

        /* Letter Bank Grid */
        .bank-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            direction: rtl;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        .control-btn {
            background-color: #334155;
            color: var(--text-light);
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .control-btn:hover {
            background-color: #475569;
        }

        .submit-btn {
            background-color: var(--success);
            color: #fff;
            font-weight: bold;
        }

        .submit-btn:hover {
            background-color: #16a34a;
        }

        .feedback {
            margin-top: 15px;
            text-align: center;
            font-size: 1.1rem;
            font-weight: bold;
            min-height: 28px;
        }

        .correct { color: var(--success); }
        .incorrect { color: var(--danger); }
    </style>
</head>
<body>

    <header>
        <h1>🐝 Arabic Spelling Bee</h1>
        <p>Listen, arrange the letters, and spell the word correctly</p>
    </header>

    <div class="game-container">
        
        <div class="top-bar">
            <div class="level-board">Word <span id="word-index">1</span> / <span id="total-words">5</span></div>
            <div class="score-board">Score: <span id="score">0</span></div>
        </div>

        <div class="audio-section">
            <button class="listen-btn" onclick="playCurrentWord()">
                🔊 Hear Word
            </button>
            <div class="meaning-hint" id="meaning-hint">Meaning: "Book"</div>
        </div>

        <!-- Built Word Display (RTL) -->
        <div class="answer-display" id="answer-display">
            <!-- Selected tiles will appear here -->
        </div>

        <!-- Scrambled Letter Bank -->
        <div class="bank-grid" id="bank-grid">
            <!-- Scrambled letter tiles -->
        </div>

        <div class="controls">
            <button class="control-btn" onclick="clearAnswer()">Clear</button>
            <button class="control-btn submit-btn" onclick="checkSpelling()">Submit Answer</button>
        </div>

        <div class="feedback" id="feedback"></div>

    </div>

    <script>
        const wordList = [
            { target: "كِتَاب", meaning: "Book", letters: ["كِ", "تَا", "بٌ"] },
            { target: "قَلَم", meaning: "Pen", letters: ["قَ", "لَ", "مٌ"] },
            { target: "مَدْرَسَة", meaning: "School", letters: ["مَ", "دْ", "رَ", "سَ", "ةٌ"] },
            { target: "مُعَلِّم", meaning: "Teacher", letters: ["مُ", "عَ", "لِّ", "مٌ"] },
            { target: "شَمْس", meaning: "Sun", letters: ["شَ", "مْ", "سٌ"] }
        ];

        let currentIndex = 0;
        let score = 0;
        let currentSelection = [];

        function initGame() {
            document.getElementById('total-words').innerText = wordList.length;
            loadWord();
        }

        function loadWord() {
            const wordObj = wordList[currentIndex];
            document.getElementById('word-index').innerText = currentIndex + 1;
            document.getElementById('meaning-hint').innerText = `Meaning: "${wordObj.meaning}"`;
            document.getElementById('feedback').innerText = '';
            currentSelection = [];
            renderAnswerDisplay();

            // Shuffle letters for bank
            let shuffled = [...wordObj.letters].sort(() => Math.random() - 0.5);
            
            const bankContainer = document.getElementById('bank-grid');
            bankContainer.innerHTML = '';
            shuffled.forEach((char, idx) => {
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.innerText = char;
                tile.dataset.id = idx;
                tile.onclick = () => selectTile(char, tile);
                bankContainer.appendChild(tile);
            });

            // Automatically play word
            setTimeout(playCurrentWord, 400);
        }

        function selectTile(char, tileElem) {
            if (tileElem.style.visibility === 'hidden') return;
            
            currentSelection.push({ char: char, elem: tileElem });
            tileElem.style.visibility = 'hidden';
            renderAnswerDisplay();
        }

        function deselectTile(index) {
            const removed = currentSelection.splice(index, 1)[0];
            removed.elem.style.visibility = 'visible';
            renderAnswerDisplay();
        }

        function renderAnswerDisplay() {
            const display = document.getElementById('answer-display');
            display.innerHTML = '';
            
            currentSelection.forEach((item, idx) => {
                const tile = document.createElement('div');
                tile.className = 'tile answer-tile';
                tile.innerText = item.char;
                tile.onclick = () => deselectTile(idx);
                display.appendChild(tile);
            });
        }

        function clearAnswer() {
            currentSelection.forEach(item => {
                item.elem.style.visibility = 'visible';
            });
            currentSelection = [];
            renderAnswerDisplay();
        }

        function checkSpelling() {
            const wordObj = wordList[currentIndex];
            const assembledWord = currentSelection.map(i => i.char).join('');
            const feedback = document.getElementById('feedback');

            if (assembledWord === wordObj.letters.join('')) {
                feedback.innerText = "🎉 ممتاز! Excellent Spelling!";
                feedback.className = "feedback correct";
                score += 20;
                document.getElementById('score').innerText = score;

                setTimeout(() => {
                    currentIndex = (currentIndex + 1) % wordList.length;
                    loadWord();
                }, 1600);
            } else {
                feedback.innerText = "❌ Try again! Listen carefully to the sounds.";
                feedback.className = "feedback incorrect";
            }
        }

        function playCurrentWord() {
            const wordObj = wordList[currentIndex];
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(wordObj.target);
                utterance.lang = 'ar-SA';
                utterance.rate = 0.75;
                window.speechSynthesis.speak(utterance);
            }
        }

        // Initialize on load
        initGame();
    </script>
</body>
</html>
